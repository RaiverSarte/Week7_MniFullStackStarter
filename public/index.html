<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Week 7 User Management</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Header -->

    <header>
        <h1>User Management System</h1>
        <p>Week 7 Mini Full-Stack Project</p>
    </header>


    <main>

        <!-- Add User Section -->

        <section class="user-form">

            <h2>Add User</h2>

            <form id="userForm">

                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >


                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="age">Age</label>

                <input
                    type="number"
                    id="age"
                    name="age"
                    placeholder="Enter your age"
                    min="1"
                >


                <button type="submit">
                    Add User
                </button>

            </form>

        </section>


        <!-- Edit User Section -->

        <section
            class="edit-form"
            id="editSection"
            style="display: none;"
        >

            <h2>Edit User</h2>

            <form id="editUserForm">

                <input
                    type="hidden"
                    id="editId"
                >


                <label for="editName">
                    Name
                </label>

                <input
                    type="text"
                    id="editName"
                    placeholder="Enter your name"
                    required
                >


                <label for="editEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="editEmail"
                    placeholder="Enter your email"
                    required
                >


                <label for="editAge">
                    Age
                </label>

                <input
                    type="number"
                    id="editAge"
                    placeholder="Enter your age"
                    min="1"
                >


                <div class="edit-buttons">

                    <button type="submit">
                        Save Changes
                    </button>

                    <button
                        type="button"
                        id="cancelEdit"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>


        <!-- Users Section -->

        <section class="users-section">

            <h2>Users</h2>

            <div id="usersList">

                <p>Loading users...</p>

            </div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
